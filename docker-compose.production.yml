version: '3.8'

# Sized for a small VPS (1-2 vCPU, 2-4 GB RAM). See docs/infrastructure.md.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    # Built and published by .github/workflows/docker-image.yml; the server only pulls it.
    # `make build-web` still builds locally (needs ~3 GB RAM for Flutter web).
    image: ${MOZNODS_IMAGE:-ghcr.io/mikhailoznobikhin/moznods-web:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moznods_web
    restart: unless-stopped
    # Loopback only: Docker bypasses ufw, and nginx reaches web over the compose network.
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 512m
    logging: *default-logging
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - USE_SQLITE=0
      - USE_INMEMORY_CHANNELS=0
      - LIVEKIT_URL=wss://${DOMAIN}
      # LiveKit runs on the host network.
      - LIVEKIT_API_URL=http://host.docker.internal:7880
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      # Shared with nginx — populated from the image on each web container start (do not bind-mount host ./moznods_flutter/build/web).
      - flutter_web_build:/app/moznods_flutter/build/web
    depends_on:
      - postgres
      - redis
    networks:
      - moznods_network

  postgres:
    image: postgres:16-alpine
    container_name: moznods_postgres
    restart: unless-stopped
    # Tuned for ~2 GB host RAM; raise shared_buffers/effective_cache_size on bigger hosts.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
    mem_limit: 512m
    logging: *default-logging
    environment:
      - POSTGRES_DB=${PGDATABASE:-moznods}
      - POSTGRES_USER=${PGUSER:-moznods}
      - POSTGRES_PASSWORD=${PGPASSWORD:-moznods_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - moznods_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-moznods} -d ${PGDATABASE:-moznods}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: moznods_redis
    restart: unless-stopped
    # Channel layer, cache and call state all set TTLs, so volatile-lru can evict safely.
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy volatile-lru
    mem_limit: 192m
    logging: *default-logging
    volumes:
      - redis_data:/data
    networks:
      - moznods_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SFU for calls (signaling + media + built-in TURN). See docs/webrtc.md.
  livekit:
    image: livekit/livekit-server:v1.13.9
    container_name: moznods_livekit
    restart: unless-stopped
    # Host networking: WebRTC needs the real public IP/ports; no docker-proxy for UDP.
    network_mode: host
    mem_limit: 512m
    logging: *default-logging
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        logging:
          level: info
        rtc:
          # Firewall: 7881/tcp, 7882-7883/udp, 3478/udp, 5349/tcp.
          tcp_port: 7881
          udp_port: 7882-7883
          use_external_ip: true
        keys:
          ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - https://${DOMAIN:?set DOMAIN in .env}/api/calls/livekit-webhook/
        turn:
          enabled: true
          domain: ${DOMAIN}
          udp_port: 3478
          tls_port: 5349
          cert_file: /etc/letsencrypt/live/${DOMAIN}/fullchain.pem
          key_file: /etc/letsencrypt/live/${DOMAIN}/privkey.pem

  nginx:
    image: nginx:alpine
    container_name: moznods_nginx
    restart: unless-stopped
    mem_limit: 128m
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - flutter_web_build:/app/moznods_flutter/build/web:ro
    depends_on:
      - web
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - moznods_network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  flutter_web_build:

networks:
  moznods_network:
    driver: bridge