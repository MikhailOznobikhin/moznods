# Development: PostgreSQL, Redis, MinIO, Django, Celery
# Usage: docker compose up -d
# Then: http://localhost:8000

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=True
      - DJANGO_LOG_LEVEL=DEBUG
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - USE_SQLITE=1
      - USE_INMEMORY_CHANNELS=1

    volumes:
      - .:/app
      - ./moznods_flutter/build/web:/app/moznods_flutter/build/web
      - ./media:/app/media
      - ./static:/app/static

#  frontend:
#    build: ./frontend
#    ports:
#      - "5173:5173"
#    volumes:
#      - ./frontend:/app
#      - /app/node_modules
#    environment:
#      - VITE_API_URL=http://localhost:8000
#      - VITE_WS_URL=ws://localhost:8000
#    depends_on:
#      - web

  # Dev SFU for calls: devkey / secret. Webhooks are not configured in --dev mode,
  # so the "in call" sidebar indicator does not update locally.
  livekit:
    image: livekit/livekit-server:v1.13.9
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  postgres_data: {}