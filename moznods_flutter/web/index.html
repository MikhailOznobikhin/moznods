<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>MOznoDS — Voice & Video Chat Platform</title>
  <meta name="description" content="MOznoDS is a modern voice and video chat platform. Create rooms, invite friends, and communicate in real-time with high-quality audio and video calls.">
  <meta name="keywords" content="voice chat, video call, webRTC, real-time communication, chat platform, Discord alternative">
  <meta name="author" content="MOznoDS">
  <meta name="robots" content="index, follow">

  <meta name="theme-color" content="#5865F2">
  <meta name="msapplication-TileColor" content="#5865F2">
  <meta name="msapplication-tap-highlight" content="no">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MOznoDS">

  <meta property="og:title" content="MOznoDS — Voice & Video Chat Platform">
  <meta property="og:description" content="Modern voice and video chat platform. Create rooms, invite friends, and communicate in real-time.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://moznods.com">
  <meta property="og:image" content="/icons/og-image.png">
  <meta property="og:site_name" content="MOznoDS">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MOznoDS — Voice & Video Chat Platform">
  <meta name="twitter:description" content="Modern voice and video chat platform. Create rooms, invite friends, and communicate in real-time.">
  <meta name="twitter:image" content="/icons/og-image.png">

  <link rel="manifest" href="/manifest.json">

  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">

  <style>
    body {
      background-color: #1E1F22;
      margin: 0;
      padding: 0;
    }
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      color: #B5BAC1;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #2B2D31;
      border-top-color: #5865F2;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .loading-text {
      margin-top: 16px;
      font-size: 14px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <link rel="preconnect" href="https://cdn.flutter.dev" crossorigin>
  <link rel="modulepreload" href="https://cdn.flutter.dev/canvas/0.2024.0/canvaskit.js" crossorigin>
</head>
<body>
  <div class="loading" id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading MOznoDS...</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) loading.style.display = 'none';
    });
  </script>
  <script src="/static/flutter_bootstrap.js" async></script>
</body>
</html>
