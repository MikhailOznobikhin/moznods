name: Build Flutter (web + APK)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-flutter-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build web + arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('moznods_flutter/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('moznods_flutter/android/**/*.gradle*', 'moznods_flutter/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Flutter pub get
        working-directory: moznods_flutter
        run: flutter pub get

      - name: Run code generation (build_runner)
        working-directory: moznods_flutter
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web
        working-directory: moznods_flutter
        run: flutter build web --release

      - name: Build APK (arm64)
        working-directory: moznods_flutter
        env:
          MOZNODS_API_BASE: ${{ vars.MOZNODS_API_BASE }}
        run: |
          if [ -n "${MOZNODS_API_BASE:-}" ]; then
            flutter build apk --release --target-platform android-arm64 --dart-define=MOZNODS_API_BASE="${MOZNODS_API_BASE}"
          else
            flutter build apk --release --target-platform android-arm64
          fi

      - name: Rename APK
        run: |
          mkdir -p dist
          cp moznods_flutter/build/app/outputs/flutter-apk/app-release.apk dist/moznods.apk
          (cd moznods_flutter/build && tar czf "$GITHUB_WORKSPACE/dist/moznods-web.tar.gz" web)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: moznods-apk
          path: dist/moznods.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: moznods-web
          path: dist/moznods-web.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/moznods.apk
            dist/moznods-web.tar.gz
          generate_release_notes: true
